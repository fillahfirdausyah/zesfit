plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fillx.zeswear'
version = '0.1.0'

// "play" for Google Play builds (ZESFIT_DISTRIBUTION=play or -PzesfitDistribution=play), "sideload" otherwise.
// Play builds drop SEND_SMS, READ_CALL_LOG and READ_CONTACTS (src/play/AndroidManifest.xml) and the code that needs them
// switches itself off (Distribution.kt).
def zesfitDistribution = (findProperty('zesfitDistribution') ?: System.getenv('ZESFIT_DISTRIBUTION') ?: 'sideload').toString().toLowerCase()
if (!(zesfitDistribution in ['play', 'sideload'])) {
  throw new GradleException("ZESFIT_DISTRIBUTION must be 'play' or 'sideload', got '${zesfitDistribution}'")
}

android {
  namespace "com.fillx.zeswear"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "DISTRIBUTION", "\"${zesfitDistribution}\""
  }
  buildFeatures {
    buildConfig true
  }
  sourceSets {
    if (zesfitDistribution == 'play') {
      debug.manifest.srcFile 'src/play/AndroidManifest.xml'
      release.manifest.srcFile 'src/play/AndroidManifest.xml'
    }
    main {
      // The shared database migrations (also imported by src/db/migrations.ts) ship as an asset.
      assets.srcDirs += file('../schema')
    }
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'org.slf4j:slf4j-api:2.0.17'
  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'androidx.health.connect:connect-client:1.1.0'
  testImplementation 'junit:junit:4.13.2'
  // android.jar ships org.json as stubs; JVM unit tests need the real implementation.
  testImplementation 'org.json:json:20250517'
}
